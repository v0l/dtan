[package]
name = "dtan-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
nostr = "=0.45.0-alpha.3"
nostr-database = "=0.45.0-alpha.3"
nostr-memory = "=0.45.0-alpha.3"
nostr-relay-builder = "=0.45.0-alpha.3"
nostr-sdk = "=0.45.0-alpha.3"
axum = "0.8"
regex = "1"
rquickjs = { version = "0.9", features = ["loader"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
