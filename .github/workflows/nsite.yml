name: Deploy nsyte
on:
  push:
    branches:
      - main

# The deploy only needs to read the repo; the Docker Hub credential lives in a
# separate workflow. Keep the default token read-only.
permissions:
  contents: read

concurrency:
  group: nsyte-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Deno
        uses: denoland/setup-deno@v1

      - name: Deploy nsyte
        env:
          # Passed through the environment rather than interpolated into the
          # command line: `run: ... --sec ${{ secrets.NBUNK_SECRET }}` puts the
          # site signing key into the shell command, which is visible in the
          # process table and in any debug echo of the step.
          NBUNK_SECRET: ${{ secrets.NBUNK_SECRET }}
        # `bunx` resolves the @nsyte/cli devDependency; a bare `nsyte` is not on
        # PATH here.
        run: bunx nsyte deploy dist/client --sec "$NBUNK_SECRET"
