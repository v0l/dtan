name: Deploy nsyte
on:
  push:
    branches:
      - main

# The deploy only needs to read the repo; the Docker Hub credential lives in a
# separate workflow. Keep the default token read-only.
permissions:
  contents: read

concurrency:
  group: nsyte-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Deno
        uses: denoland/setup-deno@v1

      # The published package (@jsr/nsyte__cli) has no `bin` entry: it ships an
      # ESM entry at src/cli.js and calls Deno.args/Deno.exit. So `bunx nsyte`
      # cannot resolve it, and `bun` cannot execute it. `deno run` on the
      # resolved path is the supported invocation for this version.
      #
      # This step deliberately does not publish. nsyte 0.27.4 accepts a signing
      # key only via `--sec <value>` (argv, visible in the process table) or
      # `--prompt-sec` (interactive TTY). No environment-variable or
      # credential-file path exists, so CI cannot publish without exposing the
      # key. Publishing stays manual, from a TTY, where --prompt-sec keeps the
      # key out of argv and shell history.
      - name: Verify nsyte CLI loads from the locked tree
        run: |
          set -euo pipefail
          cli=node_modules/@nsyte/cli/src/cli.js
          deno run -A --quiet "$cli" --version
          deno run -A --quiet "$cli" deploy --help > /dev/null

      # Regression guard: a signing key must never be interpolated into a
      # command line again. Matches only the two real risk shapes — the Actions
      # secret expression, and a dynamic value passed to --sec — so this block's
      # own pattern text cannot trigger it. Comment lines are exempt.
      - name: Assert no signing key reaches a command line
        run: |
          set -euo pipefail
          if grep -rnE '\$\{\{[[:space:]]*secrets\.NBUNK_SECRET|--sec[[:space:]]+["$]' .github/workflows/ \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::a signing key is passed on a command line; see the comment in nsite.yml"
            exit 1
          fi
