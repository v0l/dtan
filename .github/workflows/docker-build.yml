name: Build Docker Image

on:
  push:
    branches:
      - main

concurrency:
  group: docker-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Client
        run: bun run build:client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: voidic
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: voidic/dtan:latest
          platforms: linux/amd64,linux/arm64

  build-ssr:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: voidic
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ssr
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=voidic/dtan,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ssr-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=ssr-${{ matrix.runner }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge-ssr:
    runs-on: ubuntu-latest
    needs: build-ssr
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: voidic
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t voidic/dtan:latest-ssr \
            $(printf 'voidic/dtan@sha256:%s ' *)
