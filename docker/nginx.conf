server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't send the nginx version on responses or error pages.
    server_tokens off;

    # Content Security Policy.
    #
    # Keep in sync with `CSP_DIRECTIVES` in src/csp.ts, which injects the same
    # policy as a <meta> tag for the nsite / Blossom copies of the site, since
    # those are static uploads with no way to set response headers. src/csp.test.ts
    # fails if the two copies differ.
    #
    # Each source below is something the current build actually needs. When a new
    # dependency talks to a new origin, add that origin rather than widening a
    # whole directive:
    #
    #   script-src  'self'          the build emits no inline scripts, only
    #                               /assets/*.js and /registerSW.js
    #               'wasm-unsafe-eval' @snort/system-wasm instantiates a .wasm
    #                               module for signature verification
    #   style-src   'self'          bundled CSS
    #               'unsafe-inline' React style={{...}} props and the inline
    #                               <svg style="display:none"> sprite in index.html
    #   img-src     https:          kind-0 `picture` is an arbitrary remote URL,
    #                               plus imgproxy.v0l.io and nostr-rs-api.v0l.io
    #   connect-src https: wss:     user-chosen relays (wss), LNURL zap endpoints
    #                               and the same-origin /api/swarm routes
    #   worker-src  blob:           sqlite wasm workers
    #   frame-src                   the WebTorrent player iframe
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: wss: blob:; media-src 'self' https: blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src https://wt-player.pages.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # autoplay is allowed because the WebTorrent player is a cross-origin iframe;
    # every other feature is off. COEP is deliberately not set: requiring it would
    # break the cross-origin avatars and the player iframe.
    add_header Permissions-Policy "autoplay=*, camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Hashed assets are immutable. This uses `expires` rather than `add_header`
    # on purpose: a location-level add_header suppresses every add_header above
    # it, which would silently drop the CSP for hashed assets.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
